# CleverCubs configuration. Secrets never live here: every credential comes from the environment.
# Local development: run with the "dev" profile, which imports ../.env (see .env.example).
spring:
  application:
    name: clevercubs
  datasource:
    # Always the least-privilege application user (docs/05-data-model.md section 7).
    url: ${CC_DB_URL:jdbc:mysql://127.0.0.1:3306/clevercubs}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: cc_app
    password: ${CC_DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: 10
  flyway:
    # Migrations run as the schema owner, never as the application user. One folder per database (D73):
    # db/migration/mysql (development, tests) and db/migration/postgresql (hosting without MySQL).
    user: cc_migrator
    password: ${CC_DB_MIGRATOR_PASSWORD}
    locations: classpath:db/migration/{vendor}
    placeholders:
      # Used only by the PostgreSQL callback, which creates the cc_app role with this password.
      appPassword: ${CC_DB_APP_PASSWORD:}
  session:
    jdbc:
      # The session tables are created by Flyway (V4), because the application user may not run DDL.
      initialize-schema: never
  mvc:
    problemdetails:
      enabled: true
  web:
    resources:
      cache:
        # Pages, scripts and styles are small: revalidate every time (a cheap 304) so an update is never
        # hidden behind a stale copy. Course media is cached for a week (WebConfig).
        cachecontrol:
          no-cache: true

server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: CCSESSION
        http-only: true
        same-site: lax
        secure: ${CC_COOKIE_SECURE:true}
  error:
    # Never leak internals to the browser (fixes SEC-E06 / SEC-E11). Details go to the server log only.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml

clevercubs:
  media-root: ${CC_MEDIA_ROOT:../media}
  contact-email: ${CC_CONTACT_EMAIL:}
  admin:
    bootstrap-email: ${CC_ADMIN_EMAIL:}
    bootstrap-password: ${CC_ADMIN_INITIAL_PASSWORD:}

logging:
  level:
    org.clevercubs: INFO

---
# Local development: reads ../.env and allows the session cookie over plain http://localhost.
spring:
  config:
    activate:
      on-profile: dev
    import: optional:file:../.env[.properties]
  web:
    resources:
      # Pages, scripts and styles straight from the source folder when started from app/, so an edit shows
      # on the next refresh without a rebuild. Falls back to the copy inside the jar.
      static-locations: file:src/main/resources/static/, classpath:/static/
      cache:
        period: 0
        cachecontrol:
          max-age: 0
          no-cache: true
server:
  servlet:
    session:
      cookie:
        secure: false

---
# Hosted (docs/07-deployment.md, D73): the container on Vercel, with PostgreSQL from the Neon integration,
# which puts PGHOST_UNPOOLED, PGDATABASE, PGUSER and PGPASSWORD in the environment. Neon's owner role runs
# Flyway; the application connects as the least-privilege cc_app role that afterMigrate.sql creates.
# CC_DB_APP_PASSWORD, CC_ADMIN_EMAIL and CC_ADMIN_INITIAL_PASSWORD are set as Vercel secrets.
spring:
  config:
    activate:
      on-profile: cloud
  datasource:
    url: jdbc:postgresql://${PGHOST_UNPOOLED}/${PGDATABASE}?sslmode=require
    hikari:
      # Several instances may run at once; Neon's free database accepts about a hundred connections.
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    user: ${PGUSER}
    password: ${PGPASSWORD}
server:
  # Vercel sends traffic to the port in PORT (80 by default).
  port: ${PORT:80}
  # Behind Vercel's proxy: the scheme, host and client address come from the X-Forwarded-* headers, which
  # Vercel always overwrites (it never passes a client's own value on), so they can be trusted.
  forward-headers-strategy: framework
  shutdown: graceful
clevercubs:
  media-root: ${CC_MEDIA_ROOT:/app/media}
